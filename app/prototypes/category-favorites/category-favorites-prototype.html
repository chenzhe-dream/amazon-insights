const rows=all.filter(r=>r.category===selected);if(!rows.length){document.querySelector('#detail').innerHTML='<div class="empty">暂无符合条件的类目</div>';return;}
const filtered=rows.filter(r=>r.module===module&&(!onlyCandidate||r.candidate)).sort((a,b)=>b.created.localeCompare(a.created));
document.querySelector('#detail').innerHTML=`<div class="detailhead"><div><h2>${esc(rows[0].name)}</h2><p>类目 ${selected} · ${[...new Set(rows.map(r=>r.site))].join(' / ')}　<span class="pill">四模块归档</span></p></div><button id="reviewAll">查看本类目重复候选 (${rows.filter(r=>r.candidate).length})</button></div><div class="modules">${Object.entries(names).map(([k,n])=>{let list=rows.filter(r=>r.module===k);return `<button class="mod ${k===module?'active':''}" data-mod="${k}"><strong><span class="dot"></span>${n}</strong><small>${list.filter(r=>!r.condition).length} 份报告${list.some(r=>r.condition)?' · 含保存条件':''}${!list.length?' · 暂无报告':''}</small></button>`}).join('')}</div><div class="toolbar"><div><strong>${names[module]}</strong><small>历史记录 ${filtered.length} 条</small></div><select id="recordFilter" aria-label="筛选历史记录"><option value="all" ${!onlyCandidate?'selected':''}>全部历史记录</option><option value="candidate" ${onlyCandidate?'selected':''}>仅重复候选</option></select></div><div class="tablewrap"><table><thead><tr><th>研究月份 / 任务</th><th>分析条件</th><th>任务状态</th><th>采集时间（北京）</th><th>操作</th></tr></thead><tbody>${filtered.map(r=>`<tr><td><strong>${scope(r)}</strong><small>${r.condition?'旧版收藏条件':r.id.slice(0,8)}${r.linked?' · 四模块联动':''}</small>${r.candidate?'<span class="candidate">同条件重复候选</span>':''}</td><td>${r.pool?'商品池 '+r.pool:'—'}${r.head?'<small>头部 Top '+r.head+'</small>':''}${r.newMonths?'<small>新品 '+r.newMonths+' 个月内</small>':''}</td><td><span class="status ${r.status}">${statuses[r.status]||esc(r.status)}</span></td><td>${date(r.created)}</td><td><button class="link" data-view="${r.id}">查看详情</button>${r.condition?'<span class="no-report">暂无报告</span>':`<a class="link" href="${esc(reportHref(r))}" target="_self" title="打开此历史报告，浏览器返回可回到列表">预览报告 ↗</a>`}<button class="link remove" data-remove="${r.id}">移除预览</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">此模块暂无符合条件的报告</td></tr>'}</tbody></table></div><div class="hint">模块分别保留原研究月份和分析条件。任务状态来自历史记录，不表示四模块均已验收。<br>移除预览仅整理收藏入口，底层报告、采集数据和人工标注保留。</div>`;
}
const modal=document.querySelector('#modal');function show(title,body,footer){document.querySelector('#modalTitle').textContent=title;document.querySelector('#modalBody').innerHTML=body;document.querySelector('#modalFoot').innerHTML=footer;modal.showModal();}
function removal(ids){const list=live().filter(r=>ids.includes(r.id));if(!list.length){show('暂无重复候选','当前类目没有待处理的同条件重复候选。','<button data-close>返回</button>');return;}
show('移除收藏入口 · 演示预览',`<div class="notice">准备从演示列表移除 ${list.length} 条模块记录。实际数据库不会变化。</div><ul><li>保留底层任务、报告、采集数据和人工标注。</li><li>不影响该类目的其他模块和历史版本。</li><li>正式功能建议采用可撤销的“移出收藏”。</li></ul>${list.map(r=>`<div class="item"><strong>${r.category} · ${names[r.module]} · ${scope(r)}</strong><small>待移除：${r.id}</small>${r.keep?`<small>建议保留：${r.keep}</small>`:'<small>这是手动选择的记录，不代表内容重复。</small>'}</div>`).join('')}`,'<button data-close>取消</button><button class="purple" id="simulateRemove">在演示中移除</button>');
document.querySelector('#simulateRemove').onclick=()=>{list.forEach(r=>removed.add(r.id));modal.close();render();};
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.cat){selected=b.dataset.cat;module='overview';onlyCandidate=false;render();}if(b.dataset.mod){module=b.dataset.mod;onlyCandidate=false;render();}if(b.dataset.site){site=b.dataset.site;document.querySelectorAll('[data-site]').forEach(x=>x.classList.toggle('active',x===b));render();}if(b.dataset.remove)removal([b.dataset.remove]);if(b.id==='reviewAll')removal(visible().filter(r=>r.category===selected&&r.candidate).map(r=>r.id));if(b.dataset.view){const r=RECORDS.find(r=>r.id===b.dataset.view);show('历史记录详情',`<div class="notice">${esc(r.name)} · ${names[r.module]}</div><p>站点：${r.site}<br>研究范围：${scope(r)}<br>状态：${statuses[r.status]}<br>任务编号：${r.id}<br>采集时间：${date(r.created)}<br>商品池：${r.pool??'未单独指定'}<br>新品定义：${r.newMonths??'未单独指定'}<br>规则版本：${esc(r.flow??'仅保存条件')}</p><br><p>可在列表点击“预览报告”，直接打开 32900 对应历史任务，浏览器返回可回到列表；仅保存条件的记录暂无报告。</p>`,'<button data-close>返回列表</button>');}if(b.hasAttribute('data-close')||b.id==='closeModal')modal.close();});
document.addEventListener('change',e=>{if(e.target.id==='recordFilter'){onlyCandidate=e.target.value==='candidate';render();}});
document.querySelector('#searchForm').onsubmit=e=>{e.preventDefault();search=document.querySelector('#search').value.trim();render();};document.querySelector('#resetSearch').onclick=()=>{search='';document.querySelector('#search').value='';render();};document.querySelector('#restore').onclick=()=>{removed.clear();render();};render();
</script></body></html>
